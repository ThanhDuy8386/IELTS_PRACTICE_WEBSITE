services:
  mysql:
    image: mysql:8.4
    container_name: ielts-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ieltsapp}
      MYSQL_USER: ${MYSQL_USER:-ielts}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ielts_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    container_name: ielts-api
    build:
      context: ./Backend/IELTS_PRACTICE
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      UseHttpsRedirection: "false"
      ApplyMigrationsOnStartup: "true"
      ConnectionStrings__DefaultConnection: server=mysql;port=3306;database=${MYSQL_DATABASE:-ieltsapp};user=${MYSQL_USER:-ielts};password=${MYSQL_PASSWORD:-ielts_password}
      Cors__AllowedOrigins: http://localhost,http://localhost:80,http://localhost:8080,http://127.0.0.1,http://127.0.0.1:8080
      JwtSettings__Key: ${JWT_KEY:-change_this_dev_only_secret_key_32_chars_min}
      JwtSettings__Issuer: ${JWT_ISSUER:-IELTS_PRACTICE_API}
      JwtSettings__Audience: ${JWT_AUDIENCE:-IELTS_PRACTICE_CLIENT}
      JwtSettings__DurationInMinutes: ${JWT_DURATION_MINUTES:-120}
    volumes:
      - ./Backend/IELTS_PRACTICE/UploadedFiles:/app/UploadedFiles
    expose:
      - "8080"

  web:
    container_name: ielts-web
    build:
      context: ./Frontend/ielts-app
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  mysql-data:
